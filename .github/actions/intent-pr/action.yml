name: Intent PR Context
description: Posts a comment on a PR showing relevant .intent/ context for the diff

inputs:
  github-token:
    description: GitHub token for posting PR comments
    required: true
  base-ref:
    description: Base branch ref to diff against (default: origin/main)
    required: false
    default: origin/main

runs:
  using: composite
  steps:
    - name: Set up Node
      uses: actions/setup-node@v4
      with:
        node-version: 22

    - name: Install intent CLI
      shell: bash
      run: npm install -g @dev-sixbyfive/intent-cli

    - name: Fetch base branch
      shell: bash
      run: git fetch origin ${{ inputs.base-ref }} --depth=1

    - name: Run intent review-diff
      id: review
      shell: bash
      run: |
        OUTPUT=$(intent review-diff --base ${{ inputs.base-ref }} 2>&1 || true)
        echo "output<<INTENT_EOF" >> "$GITHUB_OUTPUT"
        echo "$OUTPUT" >> "$GITHUB_OUTPUT"
        echo "INTENT_EOF" >> "$GITHUB_OUTPUT"

    - name: Post PR comment
      uses: actions/github-script@v7
      with:
        github-token: ${{ inputs.github-token }}
        script: |
          const raw = `${{ steps.review.outputs.output }}`;
          if (!raw || raw.includes('No related intent context')) {
            console.log('No intent context to post');
            return;
          }

          const body = [
            '## 🧭 Intent Context',
            '',
            '> Relevant plans, decisions, and systems for this PR.',
            '',
            '```',
            raw,
            '```',
            '',
            '<sub>Generated by [Intent](https://github.com/SixByFive/intent)</sub>',
          ].join('\n');

          const { data: comments } = await github.rest.issues.listComments({
            owner: context.repo.owner,
            repo: context.repo.repo,
            issue_number: context.issue.number,
          });

          const existing = comments.find(c =>
            c.user?.type === 'Bot' && c.body?.includes('🧭 Intent Context')
          );

          if (existing) {
            await github.rest.issues.updateComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              comment_id: existing.id,
              body,
            });
          } else {
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              body,
            });
          }
